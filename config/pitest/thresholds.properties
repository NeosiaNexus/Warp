# Mutation score thresholds, one per module running mutation tests (warp.pitest-conventions): the
# percentage of PIT's mutants the module's unit tests must kill. `./gradlew pitest` fails below.
#
# A ratchet, moved by the full analysis only: when the nightly Mutation testing run on main says a
# module's score has outgrown its threshold, raise the threshold to that score rounded down, in a
# pull request of its own, and not while a stack of pull requests is still landing. A pull request's
# own run mutates only the classes it changes, so its score is not the module's. Never lower a
# threshold to let a change in.
protocol=94
proxy=47
