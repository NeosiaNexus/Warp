# Mutation score thresholds, one per module running mutation tests (warp.pitest-conventions): the
# percentage of PIT's mutants the module's unit tests must kill. `./gradlew pitest` fails below.
#
# A ratchet: when a module's score goes up, raise its threshold to the new score rounded down
# (the Mutation testing workflow says when); never lower one to let a change in.
protocol=81
proxy=40
