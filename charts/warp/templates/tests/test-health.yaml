apiVersion: v1
kind: Pod
metadata:
  name: {{ include "warp.fullname" . }}-test-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warp.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    # The image's own health command, against the management Service: the proxies answer their
    # readiness probe, so new players may be sent to them.
    - name: health
      image: {{ include "warp.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      args:
        - health
        - --url
        - {{ printf "%s://%s:%d/readyz" (include "warp.managementScheme" . | lower) (include "warp.managementServiceName" .) (int .Values.management.port) | quote }}
        {{- if .Values.management.tls.enabled }}
        - --ca-file
        - /etc/warp/tls/tls.crt
        {{- end }}
        - --timeout
        - "20"
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        {{- if .Values.management.tls.enabled }}
        - name: tls
          mountPath: /etc/warp/tls
          readOnly: true
        {{- end }}
  volumes:
    - name: tmp
      emptyDir: {}
    - name: data
      emptyDir: {}
    {{- if .Values.management.tls.enabled }}
    - name: tls
      secret:
        secretName: {{ .Values.management.tls.secretName }}
    {{- end }}
