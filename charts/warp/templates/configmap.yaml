{{- include "warp.validate" . -}}
{{- $v := .Values -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "warp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warp.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  warp.conf: |
{{- if $v.config.raw }}
    {{- $v.config.raw | nindent 4 }}
{{- else }}
    # Generated by the warp Helm chart ({{ include "warp.chart" . }}). Keys left out keep Warp's
    # defaults: https://github.com/NeosiaNexus/Warp/blob/main/docs/deploy/kubernetes.md#configuration
    config-version = 1

    bind = "0.0.0.0:25577"
    online-mode = {{ $v.config.onlineMode }}
    accepts-transfers = {{ $v.config.acceptsTransfers }}
    player-limit = {{ $v.config.playerLimit }}

    servers {
    {{- range $name, $server := $v.config.servers }}
      {{ $name | quote }} {
      {{- if kindIs "string" $server }}
        address = {{ $server | quote }}
      {{- else }}
        {{- range $key, $value := $server }}
        {{ $key }} = {{ toJson $value }}
        {{- end }}
      {{- end }}
      }
    {{- end }}
    }
    default-server = {{ $v.config.defaultServer | quote }}
    {{- if $v.config.fallbackOrder }}
    fallback-order = {{ include "warp.hoconList" $v.config.fallbackOrder }}
    {{- end }}

    groups {
    {{- range $name, $group := $v.config.groups }}
      {{ $name | quote }} {
      {{- range $key, $value := $group }}
        {{ $key }} = {{ toJson $value }}
      {{- end }}
      }
    {{- end }}
    }

    routes {
    {{- range $host, $target := $v.config.routes }}
      {{ $host | quote }} = {{ $target | quote }}
    {{- end }}
    }

    forwarding {
      mode = {{ $v.config.forwarding.mode | quote }}
      # The secret comes from the WARP_FORWARDING_SECRET variable (the chart's Secret).
    }

    status {
      motd = {{ include "warp.hocon" $v.config.status.motd }}
      {{- if $v.config.status.maxPlayers }}
      max-players = {{ $v.config.status.maxPlayers }}
      {{- end }}
    }

    compression {
      threshold = {{ $v.config.compression.threshold }}
      passthrough = {{ $v.config.compression.passthrough }}
    }

    logging {
      format = {{ $v.config.logging.format }}
    }

    proxy-protocol {
      enabled = {{ $v.config.proxyProtocol.enabled }}
      trusted-proxies = {{ include "warp.hoconList" $v.config.proxyProtocol.trustedProxies }}
    }

    {{- with $v.config.extra }}

    # config.extra
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}

    # Kept by the chart whatever config.raw says: its probes, hooks and metrics rely on them.
    management {
      enabled = true
      bind = "0.0.0.0:{{ $v.management.port }}"
      ready-requires-server = {{ $v.management.readyRequiresServer }}
      # The drain token comes from the WARP_MANAGEMENT_TOKEN variable (the chart's Secret).
      {{- if $v.management.tls.enabled }}
      tls {
        certificate = "/etc/warp/tls/tls.crt"
        key = "/etc/warp/tls/tls.key"
      }
      {{- end }}
      metrics {
        enabled = {{ $v.management.metrics.enabled }}
        require-token = {{ $v.management.metrics.requireToken }}
        server-ping-interval = {{ $v.management.metrics.serverPingInterval }}
      }
      console {
        enabled = {{ $v.management.console.enabled }}
        tokens = [
        {{- range $v.management.console.tokens }}
          { name = {{ .name | quote }}, scopes = {{ include "warp.hoconList" .scopes }}, env = {{ printf "WARP_CONSOLE_TOKEN_%s" (.name | upper | replace "-" "_") | quote }} }
        {{- end }}
        ]
        trusted-networks = {{ include "warp.hoconList" $v.management.console.trustedNetworks }}
        history = {{ $v.management.console.history }}
      }
    }

    drain {
      on-sigterm = {{ eq $v.drain.mode "sigterm" }}
      transfer-to = {{ $v.drain.transferTo | quote }}
      propagation-delay = {{ $v.drain.propagationDelay }}
      transfer-interval = {{ $v.drain.transferInterval }}
      cannot-transfer = {{ $v.drain.cannotTransfer }}
      new-players = {{ $v.drain.newPlayers }}
      timeout = {{ $v.drain.timeout }}
    }
