{{- if not .Values.secrets.existingSecret }}
{{- $name := include "warp.fullname" . }}
{{- /* Generated values are kept across upgrades: the existing Secret is read back. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warp.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
type: Opaque
data:
  {{ .Values.secrets.forwardingSecretKey }}: {{ include "warp.secretValue" (dict "data" $data "key" .Values.secrets.forwardingSecretKey "value" .Values.secrets.forwardingSecret) }}
  {{ .Values.secrets.managementTokenKey }}: {{ include "warp.secretValue" (dict "data" $data "key" .Values.secrets.managementTokenKey "value" .Values.secrets.managementToken) }}
  {{- if .Values.secrets.antiBot.shared }}
  {{ .Values.secrets.antiBot.secretKey }}: {{ include "warp.secretValue" (dict "data" $data "key" .Values.secrets.antiBot.secretKey "value" .Values.secrets.antiBot.secret) }}
  {{ .Values.secrets.antiBot.tokenSecretKey }}: {{ include "warp.secretValue" (dict "data" $data "key" .Values.secrets.antiBot.tokenSecretKey "value" .Values.secrets.antiBot.tokenSecret) }}
  {{- end }}
  {{- range .Values.management.console.tokens }}
  {{- if .generate }}
  {{ .secretKey }}: {{ include "warp.secretValue" (dict "data" $data "key" .secretKey "value" "") }}
  {{- end }}
  {{- end }}
{{- end }}
