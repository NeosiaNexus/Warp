[versions]
# Core
netty = "4.2.18.Final"
adventure = "4.26.1"
log4j = "2.26.1"
slf4j = "2.0.17"
guice = "7.0.0"
guava = "33.7.2-jre"

# Utilities
caffeine = "3.3.0"
disruptor = "4.0.0"
gson = "2.14.0"
configurate = "4.2.0"
jspecify = "1.0.0"

# Native
netty-tcnative = "2.0.84.Final"

# Code quality
errorprone-core = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.2"
spotless = "8.10.3"
checkstyle = "13.11.0"
jacoco = "0.8.15"

# Testing
junit = "5.12.2"
mockito = "5.24.0"

# Benchmarking
jmh = "1.37"
jmh-plugin = "0.7.3"
velocity-native = "4.2.0"

# Build plugins
shadow = "9.6.1"

[libraries]
# Netty
netty-bom = { group = "io.netty", name = "netty-bom", version.ref = "netty" }
netty-buffer = { group = "io.netty", name = "netty-buffer" }
netty-codec = { group = "io.netty", name = "netty-codec" }
netty-handler = { group = "io.netty", name = "netty-handler" }
netty-transport = { group = "io.netty", name = "netty-transport" }
netty-transport-native-epoll = { group = "io.netty", name = "netty-transport-native-epoll" }
netty-transport-native-kqueue = { group = "io.netty", name = "netty-transport-native-kqueue" }

# Adventure (Minecraft text components)
adventure-bom = { group = "net.kyori", name = "adventure-bom", version.ref = "adventure" }
adventure-api = { group = "net.kyori", name = "adventure-api" }
adventure-text-minimessage = { group = "net.kyori", name = "adventure-text-minimessage" }
adventure-text-serializer-gson = { group = "net.kyori", name = "adventure-text-serializer-gson" }
adventure-text-serializer-plain = { group = "net.kyori", name = "adventure-text-serializer-plain" }

# Logging
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version.ref = "log4j" }
log4j-iostreams = { group = "org.apache.logging.log4j", name = "log4j-iostreams", version.ref = "log4j" }
log4j-jul = { group = "org.apache.logging.log4j", name = "log4j-jul", version.ref = "log4j" }
log4j-layout-template-json = { group = "org.apache.logging.log4j", name = "log4j-layout-template-json", version.ref = "log4j" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

# Async logging
disruptor = { group = "com.lmax", name = "disruptor", version.ref = "disruptor" }

# DI
guice = { group = "com.google.inject", name = "guice", version.ref = "guice" }
# Not a direct dependency: the minimum version of the Guava that Guice brings (api/build.gradle.kts).
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# Utilities
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
configurate-hocon = { group = "org.spongepowered", name = "configurate-hocon", version.ref = "configurate" }

# Annotations
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }

# Native
netty-tcnative-boringssl = { group = "io.netty", name = "netty-tcnative-boringssl-static", version.ref = "netty-tcnative" }

# Code quality
errorprone-core = { group = "com.google.errorprone", name = "error_prone_core", version.ref = "errorprone-core" }
nullaway = { group = "com.uber.nullaway", name = "nullaway", version.ref = "nullaway" }
# Gradle resolves these two from `toolVersion`; declared here so that Dependabot updates them too.
checkstyle = { group = "com.puppycrawl.tools", name = "checkstyle", version.ref = "checkstyle" }
jacoco-agent = { group = "org.jacoco", name = "org.jacoco.agent", version.ref = "jacoco" }

# Testing
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }

# Benchmarking
jmh-core = { group = "org.openjdk.jmh", name = "jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { group = "org.openjdk.jmh", name = "jmh-generator-annprocess", version.ref = "jmh" }
velocity-native = { group = "com.velocitypowered", name = "velocity-native", version.ref = "velocity-native" }

[bundles]
netty = ["netty-buffer", "netty-codec", "netty-handler", "netty-transport"]
adventure = ["adventure-api", "adventure-text-minimessage", "adventure-text-serializer-gson"]
log4j = ["log4j-api", "log4j-core", "log4j-slf4j2-impl", "log4j-iostreams", "log4j-jul", "log4j-layout-template-json"]
testing = ["junit-jupiter", "mockito-core", "mockito-junit-jupiter"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
