# Log4j settings that log4j2.xml cannot hold.
#
# When the asynchronous loggers' ring buffer is full (the logging thread cannot keep up: a disk
# stalling, say), records of level INFO and below are dropped rather than making the threads that
# log, Netty's event loops among them, wait for room. WARN and ERROR still wait: they are never lost.
log4j2.asyncQueueFullPolicy=Discard
log4j2.discardThreshold=INFO
