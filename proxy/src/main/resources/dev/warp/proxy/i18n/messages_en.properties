# Warp's messages to players, in English: the language every other one falls back to.
#
# Translating Warp: copy this file to messages_<language>.properties (messages_de.properties,
# messages_pt_BR.properties...), translate every value, keep the keys and the placeholders
# (<server>, <reason>...) as they are, and add the language to PlayerMessages.BUNDLED. The values are
# MiniMessage (https://docs.advntr.dev/minimessage/format), read as UTF-8.
#
# The multiplayer.* keys are vanilla's: a client that knows them translates them itself, in its own
# language. These texts are only for clients too old to know them.

multiplayer.disconnect.server_full=The server is full.
multiplayer.disconnect.slow_login=Took too long to log in.
multiplayer.disconnect.authservers_down=Minecraft's authentication servers are down. Please try again later.
multiplayer.disconnect.unexpected_query_response=Unexpected custom data from client.
multiplayer.disconnect.invalid_public_key_signature=Invalid signature for profile public key. Try restarting your game.
multiplayer.disconnect.transfers_disabled=This server does not accept transfers.
multiplayer.disconnect.duplicate_login=You logged in from another location.
multiplayer.disconnect.server_shutdown=Server closed.

warp.login.too-fast=You are logging in too fast. Please try again in <seconds> s.
warp.login.too-many-logins=Too many logins in progress from your address. Please try again in a moment.
warp.login.busy=The server is busy logging players in. Please try again in <seconds> s.
warp.login.lockdown=This server only lets in players who have played here before, for now. Please try again later.
warp.login.invalid-username=Your username is not valid: it must be 3 to 16 letters, digits or underscores.
warp.login.unexpected-packet=Your game sent something unexpected while logging in. Please reconnect; if it keeps happening, try without mods.
warp.login.encryption-failed=Your game could not set up a secure connection. Please reconnect.
warp.login.authentication-failed=Minecraft could not confirm your account. Restart your game and your launcher, then try again.
warp.login.already-connected=You are already connected to this server. If you just left, wait a moment and try again.

