# Warp's messages to players, in English: the language every other one falls back to.
#
# Translating Warp: copy this file to messages_<language>.properties (messages_de.properties,
# messages_pt_BR.properties...), translate every value, keep the keys and the placeholders
# (<server>, <reason>...) as they are, and add the language to PlayerMessages.BUNDLED. The values are
# MiniMessage (https://docs.advntr.dev/minimessage/format), read as UTF-8.
#
# The multiplayer.* keys are vanilla's: a client that knows them translates them itself, in its own
# language. These texts are only for clients too old to know them.

