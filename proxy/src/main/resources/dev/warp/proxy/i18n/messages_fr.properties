# Les messages de Warp aux joueurs, en français. Voir messages_en.properties pour le format.

multiplayer.disconnect.server_full=Le serveur est complet.
multiplayer.disconnect.slow_login=La connexion a pris trop de temps.
multiplayer.disconnect.authservers_down=Les serveurs d'authentification de Minecraft sont indisponibles. Veuillez réessayer plus tard.
multiplayer.disconnect.unexpected_query_response=Données personnalisées inattendues reçues du client.
multiplayer.disconnect.invalid_public_key_signature=Signature de la clé publique du profil invalide. Essayez de redémarrer votre jeu.
multiplayer.disconnect.transfers_disabled=Ce serveur n'accepte pas les transferts.
multiplayer.disconnect.duplicate_login=Vous vous êtes connecté depuis un autre emplacement.
multiplayer.disconnect.server_shutdown=Serveur fermé.

warp.login.too-fast=Vous vous connectez trop souvent. Veuillez réessayer dans <seconds> s.
warp.login.too-many-logins=Trop de connexions en cours depuis votre adresse. Veuillez réessayer dans un instant.
warp.login.busy=Le serveur est occupé à connecter des joueurs. Veuillez réessayer dans <seconds> s.
warp.login.lockdown=Pour le moment, ce serveur n'accepte que les joueurs qui y ont déjà joué. Veuillez réessayer plus tard.
warp.login.verification-busy=Le serveur vérifie beaucoup de nouveaux joueurs en ce moment. Veuillez réessayer dans <seconds> s.
warp.login.verification-failed=Votre jeu n'a pas répondu aux vérifications du serveur comme Minecraft le fait. Veuillez vous reconnecter ; si cela se reproduit, essayez sans mods.
warp.login.verification-timed-out=Votre jeu a mis trop de temps à répondre aux vérifications du serveur. Veuillez vous reconnecter.
warp.login.verified-reconnect=<green>Vous avez été vérifié.</green> Veuillez vous reconnecter pour rejoindre le serveur.
warp.login.invalid-username=Votre pseudo n'est pas valide : il doit compter de 3 à 16 lettres, chiffres ou tirets bas.
warp.login.unexpected-packet=Votre jeu a envoyé une donnée inattendue pendant la connexion. Reconnectez-vous ; si cela se reproduit, essayez sans mods.
warp.login.encryption-failed=Votre jeu n'a pas pu établir de connexion sécurisée. Veuillez vous reconnecter.
warp.login.authentication-failed=Minecraft n'a pas pu confirmer votre compte. Redémarrez votre jeu et votre launcher, puis réessayez.
warp.login.already-connected=Vous êtes déjà connecté à ce serveur. Si vous venez de le quitter, patientez un instant puis réessayez.

warp.disconnect.restarting=<yellow>Ce serveur redémarre. Reconnectez-vous dans un instant.
warp.disconnect.no-server-available=Aucun serveur n'est disponible pour le moment. Veuillez réessayer plus tard.
warp.disconnect.no-server-left=Impossible de se connecter à un serveur. Veuillez réessayer dans un instant.
warp.disconnect.initial-server-denied=Vous ne pouvez pas rejoindre ce serveur pour le moment. Veuillez réessayer plus tard.
warp.disconnect.fallback-denied=Vous ne pouvez pas rejoindre <server> pour le moment. Veuillez réessayer plus tard.
warp.disconnect.switch-timed-out=Le changement de serveur a pris trop de temps. Veuillez vous reconnecter.
warp.disconnect.wait-timed-out=Aucun serveur n'a pu vous accueillir à temps. Veuillez vous reconnecter.
warp.disconnect.reason-too-long=Vous avez été déconnecté. La raison était trop longue pour être affichée par votre jeu.
warp.disconnect.internal-error=Une erreur est survenue sur le serveur. Veuillez vous reconnecter.<newline><newline><gray>Si cela se reproduit, donnez cette référence à l'équipe du serveur : <reference>

