# Well-known Velocity and BungeeCord plugins, and what becomes of them on Warp.
#
# One line per plugin: <match> = <STATUS>: <text>. A jar in plugins/ matches when its file name,
# lowercased and without ".jar", contains <match>. The first line that matches wins, so put the
# more specific names first. STATUS is one of:
#   BUILT_IN     Warp does this itself, no plugin needed
#   REPLACED     a Warp plugin does it; the text says which
#   UNAVAILABLE  no Warp build of the plugin exists yet
# Anything else is reported as unknown: Velocity and BungeeCord plugins do not run on Warp.

viabackwards = REPLACED: Warp's warp-via plugin bundles ViaVersion, ViaBackwards and ViaRewind; drop the warp-via jar of your Warp release in plugins/
viarewind = REPLACED: Warp's warp-via plugin bundles ViaVersion, ViaBackwards and ViaRewind; drop the warp-via jar of your Warp release in plugins/
viaversion = REPLACED: Warp's warp-via plugin bundles ViaVersion, ViaBackwards and ViaRewind; drop the warp-via jar of your Warp release in plugins/
sonar = BUILT_IN: Warp's anti-bot (the anti-bot block of warp.conf, on by default) replaces it
limbofilter = BUILT_IN: Warp's anti-bot (the anti-bot block of warp.conf, on by default) replaces it
limboauth = UNAVAILABLE: needs a Warp build of the plugin, not yet available
limboapi = UNAVAILABLE: needs a Warp build of the plugin, not yet available
botfilter = BUILT_IN: Warp's anti-bot (the anti-bot block of warp.conf, on by default) replaces it
antibot = BUILT_IN: Warp's anti-bot (the anti-bot block of warp.conf, on by default) replaces it
bungeeguard = BUILT_IN: Warp only forwards with Velocity's signed modern protocol; BungeeGuard's token is not needed
luckperms = UNAVAILABLE: needs a Warp build of the plugin, not yet available
skinsrestorer = UNAVAILABLE: needs a Warp build of the plugin, not yet available
geyser = UNAVAILABLE: needs a Warp build of the plugin, not yet available; a standalone Geyser in front of Warp works today
floodgate = UNAVAILABLE: needs a Warp build of the plugin, not yet available
redisbungee = UNAVAILABLE: needs a Warp build of the plugin, not yet available
litebans = UNAVAILABLE: needs a Warp build of the plugin, not yet available
plan- = UNAVAILABLE: needs a Warp build of the plugin, not yet available
protocolize = UNAVAILABLE: needs a Warp build of the plugin, not yet available
packetevents = UNAVAILABLE: needs a Warp build of the plugin, not yet available
velocity-tools = UNAVAILABLE: needs a Warp build of the plugin, not yet available
bungeetablistplus = UNAVAILABLE: needs a Warp build of the plugin, not yet available
velocitab = UNAVAILABLE: needs a Warp build of the plugin, not yet available
maintenance = UNAVAILABLE: needs a Warp build of the plugin, not yet available
spark = UNAVAILABLE: needs a Warp build of the plugin, not yet available; Warp's management server exposes /healthz and /readyz
