# Warp's configuration for containers, written to /data/warp.conf on the first start. Every key left
# out keeps the default of the reference warp.conf, which documents them all:
# https://github.com/NeosiaNexus/Warp/blob/main/docs/deploy/docker.md#configuration
#
# A value followed by the same key with ${?NAME} is replaced by the environment variable NAME when
# it is set, so that a quick start needs no file. Mount your own warp.conf at /data/warp.conf for
# anything else (groups, routes, limits, the anti-bot).
#
# Secrets never live here: WARP_FORWARDING_SECRET (or /data/forwarding.secret, generated on first
# start), WARP_MANAGEMENT_TOKEN (the drain token), WARP_ANTIBOT_SECRET, WARP_ANTIBOT_TOKEN_SECRET.

config-version = 1

bind = "0.0.0.0:25577"
bind = ${?WARP_BIND}

online-mode = true
online-mode = ${?WARP_ONLINE_MODE}

# One backend by default: WARP_LOBBY_ADDRESS, or a Compose service named lobby.
servers {
  lobby {
    address = "lobby:25565"
    address = ${?WARP_LOBBY_ADDRESS}
  }
}
default-server = "lobby"
default-server = ${?WARP_DEFAULT_SERVER}

forwarding {
  mode = "velocity"
  mode = ${?WARP_FORWARDING_MODE}
}

# Logs for `docker logs`: text; WARP_LOG_FORMAT=json for a log collector.

# The management server answers the container's HEALTHCHECK, Kubernetes probes, the drain and
# Prometheus on :9901. Keep that port inside the network: publish 25577 only.
management {
  enabled = true
  bind = "0.0.0.0:9901"
  bind = ${?WARP_MANAGEMENT_BIND}
  metrics {
    enabled = true
  }
}

# SIGTERM (docker stop, a Pod's termination) drains instead of disconnecting everyone: players are
# transferred to transfer-to when it is set (your public address, 1.20.5+ clients), the others stay
# until they leave or the time-out expires. Give the container that long to stop:
# `docker stop -t 1830`, stop_grace_period: 31m in Compose, terminationGracePeriodSeconds in
# Kubernetes (the Helm chart derives it). A second SIGTERM stops at once.
drain {
  on-sigterm = true
  transfer-to = ""
  transfer-to = ${?WARP_DRAIN_TRANSFER_TO}
  timeout = 30m
  timeout = ${?WARP_DRAIN_TIMEOUT}
}

# A load balancer that sends the PROXY protocol (HAProxy, a cloud LoadBalancer): enable it and
# list the balancer's addresses in your own warp.conf, under proxy-protocol.trusted-proxies.
proxy-protocol {
  enabled = false
  enabled = ${?WARP_PROXY_PROTOCOL}
}
