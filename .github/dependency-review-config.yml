# Licence policy of the dependency review (.github/workflows/dependency-review.yml).
#
# It applies to the dependencies a pull request adds or changes in the runtime scope: the libraries
# shaded into Warp's jar or exposed to plugins through the API (npm also reports the e2e harness's
# packages as runtime). Warp is AGPL-3.0-or-later, so they must be under a licence it can be combined
# with. Any other licence fails the review: if the dependency is acceptable anyway, list its package
# URL under allow-dependencies-licenses with a comment saying why. A licence GitHub cannot detect is
# reported without failing.

allow-licenses:
  # Permissive
  - 0BSD
  - Apache-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSL-1.0
  - CC-BY-4.0
  - CC0-1.0
  - ISC
  - MIT
  - MIT-0
  - Python-2.0
  - Unicode-3.0
  - Unicode-DFS-2016
  - Unlicense
  - UPL-1.0
  - W3C
  - X11
  - Zlib
  # Weak copyleft, compatible with the GPLv3 and the AGPLv3
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - MPL-2.0
  # Strong copyleft, compatible with the AGPLv3
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  # Copyleft with a linking exception (the OpenJDK class library licence)
  - GPL-2.0-only WITH Classpath-exception-2.0
