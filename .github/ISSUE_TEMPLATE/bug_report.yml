name: Bug Report
description: Report a bug or unexpected behavior in Warp.
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the fields below so we can reproduce and fix it.

        **Security vulnerabilities** — do NOT open a public issue. Use [GitHub Security Advisories](https://github.com/NeosiaNexus/warp/security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages or stack traces if applicable.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Start Warp with config ...
        2. Connect with client version ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: warp-version
    attributes:
      label: Warp version
      description: Output of the version command or the JAR filename.
      placeholder: "0.1.0-beta.2"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      description: Output of `java -version`.
      placeholder: "OpenJDK 21.0.10"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (x86_64)
        - Linux (aarch64)
        - macOS (x86_64)
        - macOS (aarch64)
        - Windows
        - Docker / Container
        - Other
    validations:
      required: true

  - type: textarea
    id: plugins
    attributes:
      label: Plugins
      description: List of plugins loaded on the proxy, if any.
      placeholder: "None"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, config snippets, or anything else that might help.
    validations:
      required: false
