name: Feature request
description: Suggest a new feature or an improvement.
labels: ["type: enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please search the existing issues and check the [roadmap](https://github.com/NeosiaNexus/Warp#roadmap): drain, health probes, metrics and the plugin system are already planned. Early ideas can start in [Discussions](https://github.com/NeosiaNexus/Warp/discussions/categories/ideas).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today? Concrete use cases help most.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Warp to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Proxy (connections, switching, configuration)
        - Protocol (versions, packets, compression)
        - Plugin API
        - Performance
        - Operations (deployment, monitoring)
        - Build and tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or how other proxies (Velocity, BungeeCord, Gate) handle it.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, mockups, references to other implementations, or anything else.
    validations:
      required: false
