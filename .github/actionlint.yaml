paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint 1.7.12 predates GitHub's self-repository syntax (`uses: $/...`, GA 2026-07-30),
      # for actions and for reusable workflows alike.
      - 'specifying action "\$/.+" in invalid format'
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
