name: Set up build
description: >-
  JDK 25 (Warp's toolchain), JDK 21 (runs Gradle 8.12) and Gradle with its dependency cache.
  Gradle is told to use the provisioned JDK 25 and never to download one.

runs:
  using: composite
  steps:
    # The last version listed becomes JAVA_HOME (Gradle's JVM); JAVA_HOME_25_X64 points to JDK 25.
    - name: Set up JDK 25 and JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: |
          25
          21
        verify-signature: true

    # `basic` keeps caching on the MIT-licensed actions/cache path (the default provider is a
    # proprietary preview on private repositories). The cache is written on main only, read
    # everywhere; the Gradle wrapper checksum is validated.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: basic
        add-job-summary: on-failure

    - name: Point Gradle toolchains at JDK 25
      shell: bash
      run: |
        mkdir -p ~/.gradle
        {
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64"
          echo "org.gradle.java.installations.auto-download=false"
        } >> ~/.gradle/gradle.properties
