name: Detect changes
description: >-
  What a pull request needs, from the files it changes: the build and the end-to-end tests unless
  it only changes documentation, and the whole end-to-end matrix when it changes the protocol, the
  proxy or the end-to-end harness. Any other event needs the build and the quick end-to-end tier.
  The job needs `pull-requests: read` to list the files of a pull request.

outputs:
  code:
    description: '`true` unless a pull request only changes documentation.'
    value: ${{ steps.filter.outputs.code || 'true' }}
  e2e-tier:
    description: 'Tier of e2e/versions.json the pull request needs: `full`, or `pr` (the quick one).'
    value: ${{ steps.filter.outputs.e2e-full == 'true' && 'full' || 'pr' }}

runs:
  using: composite
  steps:
    # `every`: a file counts for a filter when it matches all of its patterns, exclusions included.
    - name: Filter paths
      id: filter
      if: ${{ github.event_name == 'pull_request' }}
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        predicate-quantifier: every
        filters: |
          code:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!LICENSE'
            - '!.github/ISSUE_TEMPLATE/**'
            - '!.github/PULL_REQUEST_TEMPLATE.md'
          e2e-full:
            - '{protocol,proxy,e2e}/**'
            - '!**/*.md'
