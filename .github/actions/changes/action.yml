name: Detect changes
description: >-
  What a pull request needs, from the files it changes: the build and the end-to-end tests unless
  it only changes documentation, and the whole end-to-end matrix when it changes Warp's modules or
  what the end-to-end tests run with, and the mutation testing of each module whose main classes it
  changes. Any other event needs the build and the quick end-to-end tier, and no mutation testing
  (mutation.yml runs it nightly on main). The job needs `pull-requests: read` to list the files of a
  pull request.

outputs:
  code:
    description: '`true` unless a pull request only changes documentation.'
    value: ${{ steps.filter.outputs.code || 'true' }}
  e2e-tier:
    description: 'Tier of e2e/versions.json the pull request needs: `full`, or `pr` (the quick one).'
    value: ${{ steps.filter.outputs.e2e-full == 'true' && 'full' || 'pr' }}
  mutation:
    description: >-
      The modules whose main classes the pull request changes, as a JSON array (`["protocol"]`);
      `[]` for any other event.
    value: ${{ steps.mutation.outputs.changes || '[]' }}

runs:
  using: composite
  steps:
    # A file counts for a filter when it matches one of its patterns and none of its exclusions.
    - name: Filter paths
      id: filter
      if: ${{ github.event_name == 'pull_request' }}
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        predicate-quantifier: some-with-excludes
        filters: |
          code:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!LICENSE'
            - '!.github/ISSUE_TEMPLATE/**'
            - '!.github/PULL_REQUEST_TEMPLATE.md'
          # Warp's modules (their code, and how each builds its part of the jar) and what the
          # end-to-end tests run with (the harness, its npm dependencies, its workflow, this filter).
          # Unit tests, benchmarks and the harness's own tests change neither: CI runs them anyway.
          # Dependency and build tool bumps run the quick tier, then the full matrix on main.
          e2e-full:
            - '{api,protocol,proxy,jni}/**'
            - 'e2e/**'
            - '.github/workflows/_e2e.yml'
            - '.github/actions/changes/**'
            - '!*/src/{test,integrationTest,jmh}/**'
            - '!e2e/{test,tools}/**'
            - '!**/*.md'

    # A pull request mutates the main classes it changes (ci.yml): the Java sources of a module's
    # main source set, but package-info.java, which has no code. A change to a module's tests, its
    # build or the mutation testing setup alone mutates nothing; the nightly run (mutation.yml)
    # analyses every class of every module, and runs on any branch on demand. Each filter is named
    # after its module, which `changes` lists when it matches.
    - name: Filter mutation-tested modules
      id: mutation
      if: ${{ github.event_name == 'pull_request' }}
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        predicate-quantifier: some-with-excludes
        filters: |
          protocol:
            - 'protocol/src/main/java/**/*.java'
            - '!**/package-info.java'
          proxy:
            - 'proxy/src/main/java/**/*.java'
            - '!**/package-info.java'

    # Says which modules skip their mutation testing, and why, among the annotations of the run.
    # The modules are the filters of the previous step.
    - name: Note skipped mutation testing
      if: ${{ github.event_name == 'pull_request' }}
      shell: bash
      env:
        CHANGES: ${{ steps.mutation.outputs.changes }}
      run: |
        for module in protocol proxy; do
          if ! jq -e --arg module "$module" 'index($module)' <<< "$CHANGES" > /dev/null; then
            echo "::notice title=Mutation testing skipped for ${module}::The pull request changes no main class of ${module}. Every class is analysed nightly on main (mutation.yml)."
          fi
        done
