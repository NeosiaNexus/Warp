# The configuration of the image's smoke test (.github/scripts/docker-smoke.sh): the container's
# defaults, with the drain token and a console token from the environment.
config-version = 1
bind = "0.0.0.0:25577"
online-mode = false
servers {
  lobby { address = "lobby:25565" }
}
default-server = "lobby"
management {
  enabled = true
  bind = "0.0.0.0:9901"
  # The token of POST /drain comes from WARP_MANAGEMENT_TOKEN (token-file stays empty).
  console {
    enabled = true
    tokens = [{ name = "smoke", scopes = [logs, commands], env = "WARP_CONSOLE_SMOKE_TOKEN" }]
    # The test runs its command from inside the container (docker exec), over loopback.
    trusted-networks = ["127.0.0.0/8"]
  }
}
drain {
  on-sigterm = true
  propagation-delay = 1s
  timeout = 1m
}
