name: Fuzz nightly

# The protocol decoders, fuzzed for ten minutes each every night, and for as long as asked on
# demand, then their corpus minimized. Pull requests and pushes to main fuzz them for two minutes
# each, in CI, without gating it.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: How long to fuzz each fuzz test
        type: choice
        options: [10m, 30m, 1h, 2h]
        default: 10m

permissions: {}

# Runs go one at a time; a newer one waiting replaces an older one waiting.
concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz
    permissions:
      contents: read # check out the code
    uses: $/.github/workflows/_fuzz.yml
    with:
      duration: ${{ inputs.duration || '10m' }}
      # From the duration: the fuzz tests fuzz in two rounds on the runner's four cores, after
      # about five minutes of setup and build, and the last ten minutes report, minimize and save.
      timeout-minutes: >-
        ${{ inputs.duration == '2h' && 270 || inputs.duration == '1h' && 145
          || inputs.duration == '30m' && 85 || 40 }}
      minimize: true
