name: Soak

# Warp under sustained load on the reference version: a crowd of bots stays connected for half an
# hour, switching servers and reconnecting, while the harness samples Warp's memory, file
# descriptors, connections and threads (e2e/README.md, Soak). It fails on sustained growth (a leak),
# on connections or objects Warp keeps once every player has left, on any Warp ERROR or Netty leak
# report, and on a hung shutdown. Nightly on a clean and on a degraded network, and on demand.
on:
  # Temporary: validates the soak on its own pull request (dispatch needs it on main). Reverted
  # before merging.
  pull_request:
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak duration in minutes (1 to 45)
        type: number
        default: 30
      netem:
        description: Degrade the network between the bots and Warp (latency, jitter, loss)
        type: boolean
        default: false

permissions: {}

# A soak always runs to the end; another one on the same branch waits for it.
concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

env:
  # The reference version, and a crowd twice the size of the e2e crowd.
  MINECRAFT: 1.21.4
  BOTS: 20
  # A player far from the proxy on a poor link: about 100 ms of round trip, jittered, and 1 % of the
  # segments lost each way.
  NETEM: delay 50ms 20ms distribution normal loss 1%

jobs:
  build:
    name: Build Warp
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: $/.github/actions/setup-build

      - name: Build the shadow jar
        run: ./gradlew :proxy:shadowJar

      - name: Upload Warp jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warp-jar
          path: proxy/build/libs/warp-*.jar
          if-no-files-found: error
          retention-days: 7

  soak:
    name: Soak (${{ matrix.network }} network)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Nightly, both networks; on demand, the one asked for.
        network: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.netem && '["degraded"]' || '["clean"]') || '["clean", "degraded"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read # check out the harness
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: e2e

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The server build and the Java versions of the reference version, from e2e/versions.json.
      - name: Plan
        id: plan
        run: |
          job=$(node e2e/src/matrix.js --tier full --versions "$MINECRAFT" | jq -c '.include[0]')
          {
            echo "server=$(jq -r .server <<< "$job")"
            echo 'java<<EOF'
            jq -r .java <<< "$job"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.plan.outputs.java }}
          verify-signature: true

      # Written by the e2e workflows on main.
      - name: Restore ${{ steps.plan.outputs.server }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/warp-e2e/servers/${{ steps.plan.outputs.server }}
          key: e2e-server-${{ steps.plan.outputs.server }}-v1

      - name: Download the Warp jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: warp-jar
          path: ${{ runner.temp }}/warp

      - name: Soak for ${{ inputs.minutes || 30 }} min
        env:
          MINUTES: ${{ inputs.minutes || 30 }}
          NETWORK: ${{ matrix.network }}
          WARP_DIR: ${{ runner.temp }}/warp
        run: |
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || (( MINUTES < 1 || MINUTES > 45 )); then
            echo "::error title=Soak::minutes must be a whole number from 1 to 45, not $MINUTES"
            exit 1
          fi
          args=(--mc "$MINECRAFT" --soak "$MINUTES" --bots "$BOTS" --jar "$(find "$WARP_DIR" -name 'warp-*.jar' | head -1)")
          if [ "$NETWORK" = degraded ]; then
            args+=(--netem "$NETEM")
          fi
          e2e/run.sh "${args[@]}"

      # The time series (CSV and JSON), every log, and Warp's flight recording.
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-${{ matrix.network }}
          path: |
            e2e/build/*/soak-*
            e2e/build/*/result.json
            e2e/build/*/logs/
          if-no-files-found: warn
          retention-days: 14
