name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One run per PR (a new push cancels the previous one); every push to main runs to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that only touch documentation skip the build, the allocation guard and the
  # end-to-end tests; those that change Warp's modules or the end-to-end harness run the whole
  # end-to-end matrix, and those that change a module's code or tests run its mutation testing
  # (.github/actions/changes says which files count).
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the files of the pull request
    outputs:
      code: ${{ steps.changes.outputs.code }}
      e2e-tier: ${{ steps.changes.outputs.e2e-tier }}
      mutation: ${{ steps.changes.outputs.mutation }}
    steps:
      - name: Detect changes
        id: changes
        uses: $/.github/actions/changes

  build:
    name: Build & test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build
        uses: $/.github/actions/setup-build

      - name: Check formatting
        run: ./gradlew spotlessCheck

      # Compiles with ErrorProne + NullAway, runs unit and integration tests, Checkstyle and
      # JaCoCo, and assembles the shadow jar. Builds libdeflate for the runner and requires it: the
      # tests of native compression may not skip, and the jar the E2E tests run has it.
      - name: Build & test
        run: ./gradlew build -Pwarp.natives.required=true

      - name: Report tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        with:
          report_paths: '**/build/test-results/*/TEST-*.xml'
          annotate_only: true
          require_tests: true
          detailed_summary: true
          failed_summary_logs: true
          include_time_in_summary: true
          simplified_summary: true
          job_summary_text: '### Tests'

      - name: Report coverage
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"

      # With the audience probe plugin `build` also assembles: the E2E matrix loads it (--plugin),
      # or skips the audience scenario.
      - name: Upload Warp jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warp-jar
          path: |
            proxy/build/libs/warp-*.jar
            e2e/plugin/build/libs/e2e-audience-probe.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

      - name: Upload the via plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warp-via-jar
          path: via/build/libs/warp-via-*.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/reports/checkstyle/
            */build/test-results/
          retention-days: 7

  # Bytes allocated per packet on the hot path, against protocol/src/jmh/alloc-baseline.json, then
  # one short run of every benchmark (bin/bench-guard.sh). Counted with escape analysis off, the
  # allocation repeats within 0.3% from one run to the next, so unlike timings it can gate pull
  # requests. A job of its own: as steps of Build & test it would delay E2E, so CI OK, by 1.5
  # minutes; apart, it costs 2 runner minutes more (it compiles again) and no wait (measured on #76).
  allocation-guard:
    name: Allocation guard
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the guard script
        run: python3 bin/bench-guard-test.py

      - name: Set up build
        uses: $/.github/actions/setup-build

      - name: Guard allocation per packet
        run: bin/bench-guard.sh

      - name: Upload JMH results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-guard
          path: protocol/build/results/jmh/*.json
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

  # The container image, from the jar `build` assembled: built for the runner, started, probed,
  # pinged, drained and scanned (.github/workflows/_container.yml), never pushed.
  container:
    name: Container image
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read # check out the code
    uses: $/.github/workflows/_container.yml
    with:
      ref: ${{ github.sha }}
      version: ci
      jar-artifact: warp-jar
      push: false
      # The jar `build` assembled has this runner's libdeflate (glibc, x86_64) only: the Alpine
      # image falls back to Java's zlib here. Release and edge jars carry every platform's.
      require-natives: false

  # The Helm chart: lint, render with each ci/ values file, validate the manifests against the
  # Kubernetes API schemas (and the Prometheus Operator's CRDs), and check that its version is
  # version.txt's.
  helm:
    name: Helm chart
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up kubeconform
        env:
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          archive="kubeconform-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/$archive"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" kubeconform

      - name: Chart version matches version.txt
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          chart=$(sed -n 's/^version: *\([^ #]*\).*/\1/p' charts/warp/Chart.yaml)
          app=$(sed -n 's/^appVersion: *\([^ #]*\).*/\1/p' charts/warp/Chart.yaml)
          if [ "$chart" != "$version" ] || [ "$app" != "$version" ]; then
            echo "::error file=charts/warp/Chart.yaml::version ($chart) and appVersion ($app) must be version.txt's ($version)"
            exit 1
          fi

      - name: Lint
        run: |
          helm lint charts/warp --strict
          for values in charts/warp/ci/*-values.yaml; do
            helm lint charts/warp --strict -f "$values"
          done

      - name: Render and validate
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          helm template warp charts/warp > "$RUNNER_TEMP/rendered/default.yaml"
          for values in charts/warp/ci/*-values.yaml; do
            helm template warp charts/warp -f "$values" > "$RUNNER_TEMP/rendered/$(basename "$values" .yaml).yaml"
          done
          # shellcheck disable=SC2016 # a kubeconform template, not shell expansions
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP"/rendered/*.yaml

      # The values schema refuses a typo and a bad duration; the templates refuse an impossible
      # configuration with a message.
      - name: Refusals
        run: |
          ! helm template warp charts/warp --set typo=1 > /dev/null 2>&1 || { echo "::error::an unknown value was accepted"; exit 1; }
          ! helm template warp charts/warp --set drain.timeout=soon > /dev/null 2>&1 || { echo "::error::a bad duration was accepted"; exit 1; }
          ! helm template warp charts/warp --set config.proxyProtocol.enabled=true > /dev/null 2>&1 || { echo "::error::the PROXY protocol without trusted proxies was accepted"; exit 1; }
          helm template warp charts/warp --set drain.timeout=10m --set drain.propagationDelay=5s --set drain.gracePeriodMargin=30 \
            | grep -q 'terminationGracePeriodSeconds: 635' || { echo "::error::the grace period is not derived from the drain settings"; exit 1; }

  # actionlint (syntax, expressions, shellcheck on `run:` scripts) and zizmor (workflow security,
  # strictest persona). Findings show up as annotations on the PR.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the workflows
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          # shellcheck disable=SC2016 # a Go template for actionlint, not shell expansions
          "$RUNNER_TEMP/actionlint" -format '{{range $e := .}}::error file={{$e.Filepath}},line={{$e.Line}},col={{$e.Column}},title=actionlint [{{$e.Kind}}]::{{$e.Message}}\n{{end}}'

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          persona: auditor
          advanced-security: false
          annotations: true

  # The console where operators run Warp: started from the jar of Build & test with its console on
  # a pipe (systemd, Docker, panels) and on a pseudo-terminal (a ConPTY on Windows, through
  # pywinpty), a few commands typed and their replies checked, the log file checked for escape
  # sequences, then /shutdown and a clean exit (.github/scripts/console-smoke.py).
  console:
    name: Console (${{ matrix.os }}, ${{ matrix.mode }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
        mode: [pipe, pty]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read # check out the script
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Download the Warp jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: warp-jar
          path: ${{ runner.temp }}/warp

      - name: Install pywinpty
        if: ${{ runner.os == 'Windows' && matrix.mode == 'pty' }}
        shell: bash
        run: python -m pip install --disable-pip-version-check pywinpty==2.0.15

      - name: Type commands at the console
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          JARS: ${{ runner.temp }}/warp
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          jar=$(find "$JARS" -name 'warp-*.jar' -not -name '*-sources.jar' -not -name '*-javadoc.jar' | head -n 1)
          "$python" .github/scripts/console-smoke.py --jar "$jar" --mode "$MODE"

  # One passing version per protocol era and the newest version, plus every variant on the newest
  # the bots speak natively (e2e/versions.json, tier `pr`); every version (tier `full`) for a pull
  # request that changes Warp's modules or the harness. The full matrix also runs on main, nightly,
  # and on PRs labelled `e2e: full` (e2e.yml).
  e2e:
    name: E2E (${{ needs.changes.outputs.e2e-tier }})
    needs: [changes, build]
    permissions:
      contents: read # check out the harness
    uses: $/.github/workflows/_e2e.yml
    with:
      tier: ${{ needs.changes.outputs.e2e-tier }}

  # Two minutes of fuzzing per protocol decoder, alongside the build and the end-to-end tests. Not
  # required by CI OK: random inputs can find a bug the pull request did not add, and a check must
  # not pass or fail by chance. The checked-in seeds and findings replay in Build & test, which is
  # required. The nightly run (fuzz.yml) fuzzes for longer.
  fuzz:
    name: Fuzz
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read # check out the code
    uses: $/.github/workflows/_fuzz.yml
    with:
      duration: 2m
      # Fuzzing takes 9 minutes on a two-core runner (three rounds and the build), ten more report.
      timeout-minutes: 30

  # PIT mutation testing of the main classes the pull request changes, held to their module's
  # threshold, alongside the build and the end-to-end tests: one runner per module with such a
  # class, for as long as the change needs, not the module. A module with none skips it, as the
  # Detect changes job notes. Every class of every module is analysed nightly, in mutation.yml.
  mutation:
    name: Mutation testing
    needs: changes
    if: ${{ needs.changes.outputs.mutation != '[]' }}
    permissions:
      contents: read # check out the code
    uses: $/.github/workflows/_mutation.yml
    with:
      modules: ${{ needs.changes.outputs.mutation }}
      since: ${{ github.event.pull_request.base.sha }}
      # A few changed classes take minutes, but a pull request that changes most classes mutates
      # nearly all of them: the integration branch's 140 classes of proxy took 45 minutes. So a pull
      # request gets the nightly full run's limit (mutation.yml); a small one finishes long before.
      timeout-minutes: 90

  # The only check to mark as required: it fails if any job above failed or was cancelled, and
  # passes when they succeeded or were skipped on purpose.
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [changes, build, allocation-guard, lint-workflows, console, e2e, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo '### Required jobs'
            echo
            echo '| Job | Result |'
            echo '|---|---|'
            # shellcheck disable=SC2016 # backticks are Markdown code spans, not command substitution
            jq -r 'to_entries[] | "| `\(.key)` | \({success: "✅ success", skipped: "⏭️ skipped", failure: "❌ failure", cancelled: "🚫 cancelled"}[.value.result] // .value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
