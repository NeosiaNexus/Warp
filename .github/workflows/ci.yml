name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 25 is the toolchain Warp compiles, tests and ships with. Gradle 8.12 itself runs on
      # JDK 21 (the last version listed becomes JAVA_HOME) and finds JDK 25 via JAVA_HOME_25_X64.
      - name: Set up JDK 25 (toolchain) and JDK 21 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (Spotless)
        run: ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 spotlessCheck

      - name: Build & Test
        run: ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 build

      - name: Upload shadow JAR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: warp-${{ github.sha }}
          path: proxy/build/libs/warp-*.jar
          retention-days: 30
