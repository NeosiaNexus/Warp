name: Mutation testing

# PIT mutation testing of every main class of every module that has it (_mutation.yml): nightly on
# main, and on demand on any branch (gh workflow run mutation.yml --ref <branch>). Pull requests
# mutate only the main classes they change, in CI; this run also catches what they leave out: a
# change to a module's tests or build alone, and a change to one class that moves another's score.
#
# It holds each module's full score to its threshold, and its summary reports the score. Only this
# run on main moves a threshold: when it notes that a score has outgrown one, raise the threshold to
# the score rounded down in a pull request of its own, once any stack of pull requests has landed
# (config/pitest/thresholds.properties).
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: Mutate only the main classes changed since this revision (empty for every class)
        type: string
        default: ''

permissions: {}

# Runs go one at a time per branch; a newer one waiting replaces an older one waiting.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pitest:
    name: Mutation testing
    permissions:
      contents: read # check out the code
    uses: $/.github/workflows/_mutation.yml
    with:
      modules: '["protocol", "proxy"]'
      since: ${{ inputs.since || '' }}
      # 140 of the 170 classes of proxy once took 45 minutes on a four-core runner, and the time
      # grows with its tests: by November 2026 the nightly run was cancelled at 90 minutes three
      # days out of four. A scoped run gets as long, as a pull request's does (ci.yml): a revision
      # far enough back makes it a full run.
      timeout-minutes: 240
