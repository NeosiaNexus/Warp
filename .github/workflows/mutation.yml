name: Mutation testing

# PIT mutation testing of every main class of every module that has it (_mutation.yml): nightly on
# main, which holds each module's score to its threshold and says when to raise one, and on demand
# on any branch (gh workflow run mutation.yml --ref <branch>). Pull requests mutate only the main
# classes they change, in CI; this run also catches what they leave out: a change to a module's
# tests or build alone, and a change to one class that moves the score of another.
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: Mutate only the main classes changed since this revision (empty for every class)
        type: string
        default: ''

permissions: {}

# Runs go one at a time per branch; a newer one waiting replaces an older one waiting.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pitest:
    name: Mutation testing
    permissions:
      contents: read # check out the code
    uses: $/.github/workflows/_mutation.yml
    with:
      modules: '["protocol", "proxy"]'
      since: ${{ inputs.since || '' }}
      # Every class of proxy takes about 15 minutes on a four-core runner, and grows with its tests.
      timeout-minutes: ${{ inputs.since && 20 || 60 }}
