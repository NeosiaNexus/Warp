name: Mutation testing

# Reusable: PIT mutation testing (`./gradlew :<module>:pitest`, configured in
# build-logic/src/main/kotlin/warp.pitest-conventions.gradle.kts) of the given modules, one job per
# module so that each has a runner's cores to itself. It mutates every main class, or only those
# changed since a revision (`since`), as pull requests do. A job fails when the mutation score of
# what it mutated drops below its module's threshold in config/pitest/thresholds.properties. Its
# summary has the score and the mutants left alive in each class, and the HTML report is attached.
on:
  workflow_call:
    inputs:
      modules:
        description: The modules to analyse, as a JSON array of names (`["protocol", "proxy"]`).
        type: string
        required: true
      since:
        description: >-
          A Git revision: only the main classes changed since its merge base with the checked-out
          commit are mutated. Empty, the default, mutates every main class.
        type: string
        default: ''
      timeout-minutes:
        description: Timeout of each job, in minutes.
        type: number
        required: true

permissions: {}

jobs:
  pitest:
    name: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # check out the code
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    steps:
      # The whole history when scoped, to find the merge base of `since` with the commit.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.since != '' && '0' || '1' }}

      - name: Set up build
        uses: $/.github/actions/setup-build

      - name: Run PIT
        env:
          MODULE: ${{ matrix.module }}
          SINCE: ${{ inputs.since }}
        run: ./gradlew ":$MODULE:pitest" ${SINCE:+"-Pwarp.pitest.since=$SINCE"}

      - name: Report the mutation score
        if: ${{ !cancelled() }}
        env:
          SINCE: ${{ inputs.since }}
        run: python3 .github/scripts/mutation-summary.py ${SINCE:+--since "$SINCE"} >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the PIT report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/pitest/
          if-no-files-found: warn
          retention-days: 30
