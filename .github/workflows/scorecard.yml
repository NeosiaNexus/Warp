name: Scorecard

# OpenSSF Scorecard: grades the repository's supply-chain practices (pinned dependencies, token
# permissions, branch protection, code review, SAST, ...). Findings land in the Security tab, and
# the results are published to the OpenSSF API (https://scorecard.dev), which backs the badge.
#
# Publishing requires this exact workflow shape, checked by the OpenSSF API: no workflow or job
# `env`/`defaults`, no write permission at the workflow level, and only these actions in the job.
on:
  # Runs again when a classic branch protection rule changes, for the Branch-Protection check.
  # Changes to a ruleset (what protects main today) trigger no workflow: the next push or weekly
  # run picks them up.
  branch_protection_rule:
  push:
    branches: [main]
  # Weekly, for the checks that age (Maintained, Vulnerabilities).
  schedule:
    - cron: '41 4 * * 1'

permissions: {}

# Runs go one at a time; a newer one waiting replaces an older one waiting.
concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The permissions documented for a public repository.
    permissions:
      id-token: write # authenticate to the OpenSSF API to publish the results
      security-events: write # upload the results to code scanning
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
