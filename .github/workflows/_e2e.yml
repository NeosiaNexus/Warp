name: E2E

# Reusable: runs a tier of e2e/versions.json, one job per Minecraft version. The caller provides
# the Warp jar as the `warp-jar` artifact of the same run.
on:
  workflow_call:
    inputs:
      tier:
        description: Tier of e2e/versions.json (pr, full).
        type: string
        required: true
      versions:
        description: Comma-separated versions to keep from the tier (default all).
        type: string
        default: ''
      variants:
        description: Comma-separated variants replacing the tier's (default the tier's).
        type: string
        default: ''

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the harness
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: e2e

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The harness checks itself (matrix well-formed, failure patterns) before 50 jobs start.
      - name: Test the harness
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Plan the matrix
        id: plan
        env:
          TIER: ${{ inputs.tier }}
          VERSIONS: ${{ inputs.versions }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          matrix=$(node e2e/src/matrix.js --tier "$TIER" --versions "$VERSIONS" --variants "$VARIANTS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jobs=$(jq '.include | length' <<< "$matrix")
          echo "Planned **$jobs** end-to-end jobs (tier \`$TIER\`)." >> "$GITHUB_STEP_SUMMARY"

  run:
    name: ${{ matrix.label }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the harness
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: e2e

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          verify-signature: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # One cache entry per server build, shared by every tier and written on main only.
      - name: Restore ${{ matrix.server }}
        id: server-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/warp-e2e/servers/${{ matrix.server }}
          key: e2e-server-${{ matrix.server }}-v1

      - name: Restore ViaProxy
        id: tools-cache
        if: ${{ matrix.via }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/warp-e2e/tools
          key: e2e-tools-${{ hashFiles('e2e/versions.json') }}
          restore-keys: e2e-tools-

      - name: Download the Warp jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: warp-jar
          path: ${{ runner.temp }}/warp

      - name: Run ${{ matrix.label }}
        env:
          RUNS: ${{ matrix.runs }}
          WARP_DIR: ${{ runner.temp }}/warp
        run: e2e/run.sh --runs "$RUNS" --jar "$(find "$WARP_DIR" -name 'warp-*.jar' | head -1)"

      - name: Save ${{ matrix.server }}
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.server-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/warp-e2e/servers/${{ matrix.server }}
          key: e2e-server-${{ matrix.server }}-v1

      - name: Save ViaProxy
        if: ${{ !cancelled() && matrix.via && github.ref == 'refs/heads/main' && steps.tools-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/warp-e2e/tools
          key: e2e-tools-${{ hashFiles('e2e/versions.json') }}

      # With what a hung process printed (thread dumps), even when a retry let the job pass.
      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-result-${{ matrix.id }}
          path: |
            e2e/build/*/result.json
            e2e/build/*/logs/*-hung-*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ matrix.id }}
          path: |
            e2e/build/*/logs/
            e2e/build/*/result.json
          retention-days: 14

  report:
    name: Report
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the report script
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: e2e

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.nvmrc

      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-result-*
          path: ${{ runner.temp }}/results

      - name: Summarise
        env:
          RESULTS: ${{ runner.temp }}/results
          TIER: ${{ inputs.tier }}
        run: node e2e/src/report.js "$RESULTS" "End-to-end tests ($TIER)" >> "$GITHUB_STEP_SUMMARY"
