name: Release

on:
  push:
    branches: [main]

permissions: {}

# Releases are cut in order: a newer push waits for the current run instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the App's private key; restricted to main. Not a deployment: no history entry per push.
    environment:
      name: release
      deployment: false
    permissions:
      contents: write # commit version.txt and CHANGELOG.md, tag, create the GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pull requests opened with GITHUB_TOKEN wait for a manual approval before CI runs on them;
      # a GitHub App token lets CI run on the release PR right away. Falls back to GITHUB_TOKEN
      # until the App is configured (see CONTRIBUTING.md, "Release automation").
      - name: Mint release token
        id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write # upload the jar and its checksum to the release
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation on the repository
    steps:
      - name: Check out ${{ needs.release-please.outputs.tag_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up build
        uses: $/.github/actions/setup-build

      - name: Build shadow jar
        run: ./gradlew shadowJar

      - name: Checksum
        working-directory: proxy/build/libs
        run: sha256sum warp-*.jar | tee SHA256SUMS

      # Verifiable with: gh attestation verify warp-<version>.jar --repo NeosiaNexus/Warp
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: proxy/build/libs/warp-*.jar

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" proxy/build/libs/warp-*.jar proxy/build/libs/SHA256SUMS --clobber
