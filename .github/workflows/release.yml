name: Release

on:
  push:
    branches: [main]

permissions: {}

# Releases are cut in order: a newer push waits for the current run instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the App's private key; restricted to main. Not a deployment: no history entry per push.
    environment:
      name: release
      deployment: false
    permissions:
      contents: write # commit version.txt and CHANGELOG.md, tag, create the GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pull requests opened with GITHUB_TOKEN wait for a manual approval before CI runs on them;
      # a GitHub App token lets CI run on the release PR right away. Falls back to GITHUB_TOKEN
      # until the App is configured (see CONTRIBUTING.md, "Release automation").
      - name: Mint release token
        id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  # libdeflate for every platform Warp bundles, each built and load-tested on its own platform,
  # from the commit release-please just tagged (the one this run is for).
  natives:
    name: Natives
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read # check out the code
    uses: $/.github/workflows/_natives.yml

  publish:
    name: Publish release
    needs: [release-please, natives]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write # upload the jar, its checksum and its provenance to the release
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation on the repository
    steps:
      - name: Check out ${{ needs.release-please.outputs.tag_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up build
        uses: $/.github/actions/setup-build

      - name: Download the native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: natives
          path: ${{ runner.temp }}/natives

      # warp.release: the version of version.txt rather than the next snapshot (build.gradle.kts);
      # the build checks that the checked-out commit carries the release's tag. Every platform's
      # libdeflate goes into the jar; one missing fails the build.
      - name: Build shadow jar
        run: >-
          ./gradlew shadowJar -Pwarp.release=true
          -Pwarp.natives.dir="$RUNNER_TEMP/natives" -Pwarp.natives.required=true

      # Exactly one jar is released: the provenance below is named after it.
      - name: Checksum
        id: jar
        working-directory: proxy/build/libs
        run: |
          shopt -s nullglob
          jars=(warp-*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "::error::Expected exactly one warp-*.jar, found ${#jars[@]}."
            exit 1
          fi
          sha256sum -- "${jars[0]}" | tee SHA256SUMS
          echo "name=${jars[0]}" >> "$GITHUB_OUTPUT"

      # Signs SLSA provenance for the jar with the workflow's Sigstore identity and stores it on the
      # repository. Verifiable with: gh attestation verify warp-<version>.jar --repo NeosiaNexus/Warp
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: proxy/build/libs/${{ steps.jar.outputs.name }}

      # The signed bundle also ships with the release, under the name SLSA tooling gives provenance
      # (<artifact>.intoto.jsonl, one Sigstore bundle per line), so that the jar can be verified
      # without the attestations API:
      #   gh attestation verify warp-<version>.jar --repo NeosiaNexus/Warp \
      #     --bundle warp-<version>.jar.intoto.jsonl
      - name: Upload to the GitHub release
        working-directory: proxy/build/libs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          JAR: ${{ steps.jar.outputs.name }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp -- "$BUNDLE_PATH" "$JAR.intoto.jsonl"
          gh release upload "$TAG_NAME" "$JAR" "$JAR.intoto.jsonl" SHA256SUMS --clobber

      # The same jar goes into the container images (below), rather than a second build.
      - name: Upload the jar for the container images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jar
          path: proxy/build/libs/${{ steps.jar.outputs.name }}
          if-no-files-found: error
          retention-days: 1

  # ghcr.io/neosianexus/warp:<version> and :<version>-alpine, for linux/amd64 and linux/arm64,
  # from the released jar: tested, scanned, signed and attested (.github/workflows/_container.yml).
  container:
    name: Container images
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read # check out the code
      packages: write # push the images to GHCR
      id-token: write # sign the images and their provenance (Sigstore)
      attestations: write # store the attestations on the repository
    uses: $/.github/workflows/_container.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
      jar-artifact: release-jar
      push: true

  # The Helm chart, oci://ghcr.io/neosianexus/charts/warp:<version>, signed with cosign (keyless).
  # Its version and appVersion are version.txt's: release-please bumps them (extra-files).
  chart:
    name: Helm chart
    needs: [release-please, container]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/pkgs/container/charts%2Fwarp
    permissions:
      contents: read # check out the code
      packages: write # push the chart to GHCR
      id-token: write # sign the chart (Sigstore)
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out ${{ needs.release-please.outputs.tag_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Package
        run: |
          chart=$(sed -n 's/^version: *\([^ #]*\).*/\1/p' charts/warp/Chart.yaml)
          if [ "$chart" != "$VERSION" ]; then
            echo "::error file=charts/warp/Chart.yaml::the chart's version ($chart) is not the release's ($VERSION)"
            exit 1
          fi
          helm lint charts/warp --strict
          helm package charts/warp --destination "$RUNNER_TEMP/chart"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"

      # Verify with: cosign verify ghcr.io/neosianexus/charts/warp:<version> \
      #   --certificate-identity-regexp 'https://github.com/NeosiaNexus/Warp/' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Push and sign
        run: |
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          output=$(helm push "$RUNNER_TEMP/chart/warp-$VERSION.tgz" "$registry" 2>&1)
          echo "$output"
          digest=$(sed -n 's/^Digest: *//p' <<< "$output")
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/warp@$digest"
          {
            echo "### Helm chart"
            echo
            echo "\`helm install warp $registry/warp --version $VERSION\` (digest \`$digest\`)"
          } >> "$GITHUB_STEP_SUMMARY"
